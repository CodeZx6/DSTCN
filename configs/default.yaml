# Training Configuration

training:
  batch_size: 8
  test_batch_size: 8
  epochs: 50
  learning_rate: 0.001
  max_grad_norm: 5.0
  seed: 12

model:
  num_nodes: 80
  num_units: 96
  num_rnn_layers: 2
  seq_len: 6
  horizon: 6
  heads: 4
  d_channel: 512

data:
  num_of_weeks: 2
  num_of_days: 1
  num_of_hours: 2
  num_for_predict: 6
  points_per_hour: 6
  train_ratio: 0.6
  val_ratio: 0.2
  test_ratio: 0.2

scheduler:
  milestones: [60, 80, 100, 120, 140, 160, 180, 200, 220, 240, 260, 280]
  gamma: 0.5
  min_lr: 1.0e-12

paths:
  data_path: './data'
  save_path: './checkpoints'
  log_path: './logs'
